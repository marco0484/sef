<!DOCTYPE html>
<html lang="es">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>
    Inventario | SEFERAN
  </title>

  <link
    rel="stylesheet"
    href="styles.css"
  >

</head>

<body>

<div class="app-layout">

  <!-- SIDEBAR -->

  <aside class="sidebar">

    <div>

      <div class="logo-area">

        <h1>
          ⚙️ SEFERAN
        </h1>

        <span>
          ASSET CONTROL
        </span>

      </div>

      <nav class="menu">

        <button
          class="menu-item"
          onclick="window.location.href='index.html'"
        >
          Dashboard
        </button>

        <button
          class="menu-item active"
          onclick="window.location.href='inventario.html'"
        >
          Inventario
        </button>

        <button
          class="menu-item"
          onclick="window.location.href='movimientos.html'"
        >
          Movimientos
        </button>

        <button
          class="menu-item"
          onclick="window.location.href='auditoria.html'"
        >
          Auditoría
        </button>

        <button
          class="menu-item"
          onclick="window.location.href='usuarios.html'"
        >
          Usuarios
        </button>

        <button
          class="menu-item"
          onclick="window.location.href='evidencias.html'"
        >
          Evidencias
        </button>

      </nav>

    </div>

  </aside>

  <!-- MAIN -->

  <main class="main-content">

    <header class="topbar">

      <div>

        <h2>
          Inventario Industrial
        </h2>

        <p>
          Gestión completa de componentes y refacciones
        </p>

      </div>

    </header>

    <section class="page-card">

      <div class="section-header">

        <div>

          <h3>
            Inventario General
          </h3>

          <p>
            Inventario dinámico conectado con Supabase.
          </p>

        </div>

        <button
          class="primary-btn"
          onclick="cargarInventario()"
        >
          Actualizar
        </button>

      </div>

      <div
        class="inventory-grid"
        id="inventoryGrid"
      >

        <div class="loading-card">

          Cargando inventario...

        </div>

      </div>

    </section>

  </main>

</div>

<script>

async function cargarInventario() {

  try {

    const response = await fetch(
      "https://TU-PROYECTO.vercel.app/api/piezas"
    );

    const piezas = await response.json();

    const grid = document.getElementById(
      "inventoryGrid"
    );

    grid.innerHTML = "";

    if (!piezas.length) {

      grid.innerHTML = `
        <div class="inventory-box">

          <strong>
            Sin registros
          </strong>

          <span>
            No existen piezas registradas
          </span>

        </div>
      `;

      return;

    }

    piezas.forEach((pieza) => {

      grid.innerHTML += `

        <div class="inventory-box">

          <strong>
            ${pieza.nombre}
          </strong>

          <span>
            Stock disponible:
            ${pieza.cantidad}
            piezas
          </span>

        </div>

      `;

    });

  } catch (error) {

    console.log(error);

    document.getElementById(
      "inventoryGrid"
    ).innerHTML = `

      <div class="inventory-box">

        <strong>
          Error
        </strong>

        <span>
          No fue posible cargar el inventario
        </span>

      </div>

    `;

  }

}

cargarInventario();

</script>

</body>
</html>
