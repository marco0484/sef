<!DOCTYPE html>
<html lang="es">

<head>

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>
    Inventario | SEFERAN
  </title>

  <link
    rel="stylesheet"
    href="styles.css"
  >

</head>

<body>

<div class="app-layout">

  <!-- SIDEBAR -->

  <aside class="sidebar">

    <div>

      <div class="logo-area">

        <h1>
          ⚙️ SEFERAN
        </h1>

        <span>
          ASSET CONTROL
        </span>

      </div>

      <nav class="menu">

        <button
          class="menu-item"
          onclick="window.location.href='index.html'"
        >
          Dashboard
        </button>

        <button
          class="menu-item active"
          onclick="window.location.href='inventario.html'"
        >
          Inventario
        </button>

        <button
          class="menu-item"
          onclick="window.location.href='movimientos.html'"
        >
          Movimientos
        </button>

        <button
          class="menu-item"
          onclick="window.location.href='auditoria.html'"
        >
          Auditoría
        </button>

        <button
          class="menu-item"
          onclick="window.location.href='usuarios.html'"
        >
          Usuarios
        </button>

        <button
          class="menu-item"
          onclick="window.location.href='evidencias.html'"
        >
          Evidencias
        </button>

      </nav>

    </div>

  </aside>

  <!-- MAIN -->

  <main class="main-content">

    <header class="topbar">

      <div>

        <h2>
          Inventario Industrial
        </h2>

        <p>
          Gestión completa de componentes y refacciones
        </p>

      </div>

    </header>

    <section class="page-card">

      <h3>
        Inventario General
      </h3>

      <p>
        Gestión visual de refacciones industriales.
      </p>

      <div class="inventory-grid">

        <div class="inventory-box">

          <strong>
            Rodamiento SKF
          </strong>

          <span>
            Stock disponible: 12 piezas
          </span>

        </div>

        <div class="inventory-box">

          <strong>
            Sensor VS250
          </strong>

          <span>
            Stock disponible: 4 piezas
          </span>

        </div>

        <div class="inventory-box">

          <strong>
            Motor MXCP
          </strong>

          <span>
            Stock disponible: 2 piezas
          </span>

        </div>

      </div>

    </section>

  </main>

</div>

<script src="script.js"></script>

</html>
