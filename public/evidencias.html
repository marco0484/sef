<!DOCTYPE html>
<html lang="es">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>
    Evidencias | SEFERAN
  </title>

  <link
    rel="stylesheet"
    href="styles.css"
  >

</head>

<body>

<div class="app-layout">

  <aside class="sidebar">

    <div>

      <div class="logo-area">

        <h1>
          ⚙️ SEFERAN
        </h1>

        <span>
          ASSET CONTROL
        </span>

      </div>

      <!-- MENU COMPLETO -->

      <nav class="menu">

        <button
          class="menu-item"
          onclick="window.location.href='index.html'"
        >
          Dashboard
        </button>

        <button
          class="menu-item"
          onclick="window.location.href='inventario.html'"
        >
          Inventario
        </button>

        <button
          class="menu-item"
          onclick="window.location.href='movimientos.html'"
        >
          Movimientos
        </button>

        <button
          class="menu-item"
          onclick="window.location.href='auditoria.html'"
        >
          Auditoría
        </button>

        <button
          class="menu-item"
          onclick="window.location.href='usuarios.html'"
        >
          Usuarios
        </button>

        <button
          class="menu-item active"
          onclick="window.location.href='evidencias.html'"
        >
          Evidencias
        </button>

      </nav>

    </div>

  </aside>

  <main class="main-content">

    <header class="topbar">

      <div>

        <h2>
          Evidencias
        </h2>

        <p>
          Historial visual de mantenimiento
        </p>

      </div>

    </header>

    <section class="page-card">

      <div
        class="evidence-grid"
        id="evidenceGrid"
      >

        <div class="inventory-box">

          Cargando evidencias...

        </div>

      </div>

    </section>

  </main>

</div>

<script>

async function cargarEvidencias() {

  try {

    const response =
      await fetch("/api/evidencias");

    const evidencias =
      await response.json();

    const grid =
      document.getElementById(
        "evidenceGrid"
      );

    grid.innerHTML = "";

    if (!evidencias.length) {

      grid.innerHTML = `
        <div class="inventory-box">
          No existen evidencias
        </div>
      `;

      return;

    }

    evidencias.forEach(item => {

      // CREAR CARD
      const card =
        document.createElement("div");

      card.className =
        "evidence-card";

      card.innerHTML = `

        <img
          src="${item.imagen_url}"
          class="evidence-image"
        >

        <div class="evidence-info">

          <strong>
            Pieza ID:
            ${item.id_pieza}
          </strong>

          <p>
            ${item.comentario || "-"}
          </p>

          <span>
            ${new Date(item.fecha)
              .toLocaleString()}
          </span>

        </div>

      `;

      // INSERTAR CARD
      grid.appendChild(card);

    });

  }

  catch(error){

    console.log(error);

    document.getElementById(
      "evidenceGrid"
    ).innerHTML = `

      <div class="inventory-box">

        Error cargando evidencias

      </div>

    `;

  }

}

cargarEvidencias();

</script>

</body>
</html>
