<!DOCTYPE html>
<html lang="es">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>
    Evidencias | SEFERAN
  </title>

  <link
    rel="stylesheet"
    href="styles.css"
  >

</head>

<body>

<div class="app-layout">

  <aside class="sidebar">

    <div>

      <div class="logo-area">

        <h1>
          ⚙️ SEFERAN
        </h1>

        <span>
          ASSET CONTROL
        </span>

      </div>

      <nav class="menu">

        <button
          class="menu-item"
          onclick="window.location.href='index.html'"
        >
          Dashboard
        </button>

        <button
          class="menu-item"
          onclick="window.location.href='inventario.html'"
        >
          Inventario
        </button>

        <button
          class="menu-item active"
          onclick="window.location.href='evidencias.html'"
        >
          Evidencias
        </button>

      </nav>

    </div>

  </aside>

  <main class="main-content">

    <header class="topbar">

      <div>

        <h2>
          Evidencias
        </h2>

        <p>
          Historial visual de mantenimiento
        </p>

      </div>

    </header>

    <section class="page-card">

      <div
        class="evidence-grid"
        id="evidenceGrid"
      >

        <div class="inventory-box">

          Cargando evidencias...

        </div>

      </div>

    </section>

  </main>

</div>

<script>

async function cargarEvidencias() {

  try {

    const response =
      await fetch(
        "/api/evidencias"
      );

    const evidencias =
      await response.json();

    const grid =
      document.getElementById(
        "evidenceGrid"
      );

    grid.innerHTML = "";

    evidencias.forEach(item => {

      grid.innerHTML += `

        <div class="evidence-card">

          <img
            src="${item.imagen_url}"
            class="evidence-image"
          >

          <div class="evidence-info">

            <strong>
              Pieza ID:
              ${item.id_pieza}
            </strong>

            <p>
              ${item.comentario || "-"}
            </p>

            <span>
              ${new Date(item.fecha)
                .toLocaleString()}
            </span>

          </div>

        </div>

      `;

    });

  }

  catch(error){

    console.log(error);

  }

}

cargarEvidencias();

</script>

</body>
</html>
