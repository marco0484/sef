<!DOCTYPE html>
<html lang="es">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>
    Login | SEFERAN
  </title>

  <link
    rel="stylesheet"
    href="styles.css"
  >

</head>

<body>

<div class="login-overlay">

  <div class="login-card">

    <div class="login-header">

      <h1>
        ⚙️ SEFERAN
      </h1>

      <span>
        ASSET CONTROL
      </span>

    </div>

    <div class="login-form">

      <input
        type="text"
        id="loginUser"
        placeholder="Usuario"
      >

      <input
        type="password"
        id="loginPass"
        placeholder="Contraseña"
      >

      <button
        class="login-btn"
        onclick="login()"
      >
        Ingresar
      </button>

      <span id="loginError"></span>

    </div>

  </div>

</div>

<script src="script.js"></script>

</body>
</html>
